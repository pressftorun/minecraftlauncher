name: Release notes
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - RELEASE.md
      - docs/releases/**
      - .github/workflows/release-notes.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-notes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link published releases to the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/release-tags.txt"
          while IFS= read -r tag; do
            grep -Fq "## ${tag#v} —" CHANGELOG.md || { echo "Missing changelog: $tag" >&2; exit 1; }
          done < "$RUNNER_TEMP/release-tags.txt"
          while IFS= read -r tag; do
            printf 'Изменения версии **%s**: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n\n[Установка и использование](https://github.com/%s/blob/main/README.md).\n' "$tag" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --target main
          done < "$RUNNER_TEMP/release-tags.txt"
