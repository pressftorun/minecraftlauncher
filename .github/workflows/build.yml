name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: |
          dotnet restore desktop/CreateLauncher.csproj --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project desktop/CreateLauncher.csproj -c Release --no-restore -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-native.ps1 -Runtime ${{ matrix.rid }} -WithoutClient
      - uses: actions/upload-artifact@v4
        with:
          name: CreateLauncher-${{ matrix.rid }}
          path: dist/CreateLauncher-*-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CreateLauncher-*
          merge-multiple: true
          path: release
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content desktop/CreateLauncher.csproj -Raw)).Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists"; exit 0 }
          $archives = @(Get-ChildItem release -Filter '*.zip' | Sort-Object Name)
          if ($archives.Count -ne 2) { throw 'Expected Windows and Linux archives' }
          $checksums = $archives | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding ascii
          $assets = @($archives.FullName) + @('release/SHA256SUMS.txt')
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Create Launcher $version" --notes-file "docs/releases/$tag.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
